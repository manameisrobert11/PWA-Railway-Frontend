
[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_SOCKET_URL = "https://pwa-railway-backend-4.onrender.com"
  VITE_API_BASE = "https://pwa-railway-backend-4.onrender.com"

# REST API proxy
[[redirects]]
  from = "/api/*"
  to = "https://pwa-railway-backend-4.onrender.com/api/:splat"
  status = 200
  force = true

# Socket.IO proxy
[[redirects]]
  from = "/socket.io/*"
  to = "https://pwa-railway-backend-4.onrender.com/socket.io/:splat"
  status = 200
  force = true

# React SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
